<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary-color: #3b82f6;
  --primary-hover: #2563eb;
  --background-color: #f3f4f6;
  --card-background: #ffffff;
  --text-color: #1f2937;
  --text-light: #6b7280;
  --border-color: #e5e7eb;
  --focus-ring: rgba(59, 130, 246, 0.5);
  --success-color: #10b981;
}

body {
  margin: 0;
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--background-color);
  color: var(--text-color);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 600px;
  background: var(--card-background);
  border-radius: 16px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  padding: 40px;
  box-sizing: border-box;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.container:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

h1 {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 10px 0;
  text-align: center;
  color: #111827;
}

.lead {
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 30px;
  text-align: center;
  line-height: 1.5;
}

.form-group {
  margin-bottom: 24px;
  position: relative;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 8px;
  color: #374151;
}

.required {
  color: #ef4444;
  font-size: 12px;
  margin-left: 4px;
  font-weight: normal;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px 16px;
  font-size: 16px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  box-sizing: border-box;
  transition: border-color 0.2s, box-shadow 0.2s;
  background-color: #f9fafb;
}

select {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  font-family: inherit;
  color: var(--text-color);
  cursor: pointer;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 14px center;
  padding-right: 44px;
}

select:invalid {
  color: var(--text-light);
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px var(--focus-ring);
  background-color: #fff;
}

optgroup {
  font-weight: 700;
  color: var(--text-light);
}

optgroup option {
  font-weight: 400;
  color: var(--text-color);
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  background: var(--primary-color);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.1s;
  display: flex;
  justify-content: center;
  align-items: center;
}

button:hover {
  background: var(--primary-hover);
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  background-color: #9ca3af;
  cursor: not-allowed;
  transform: none;
}

.spinner {
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top: 3px solid #fff;
  width: 20px;
  height: 20px;
  -webkit-animation: spin 1s linear infinite; /* Safari */
  animation: spin 1s linear infinite;
  margin-left: 10px;
  display: none;
}

/* Safari */
@-webkit-keyframes spin {
  0% { -webkit-transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.note {
  margin-top: 20px;
  font-size: 12px;
  color: var(--text-light);
  text-align: center;
}

/* Modal Styles */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s, visibility 0.3s;
  z-index: 1000;
}

.modal {
  background: white;
  padding: 40px;
  border-radius: 16px;
  text-align: center;
  max-width: 400px;
  width: 90%;
  transform: scale(0.9);
  transition: transform 0.3s;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-overlay.active .modal {
  transform: scale(1);
}

.modal-icon {
  width: 60px;
  height: 60px;
  background-color: #d1fae5;
  color: var(--success-color);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
}

.modal-icon svg {
  width: 32px;
  height: 32px;
}

.modal h2 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 10px;
  color: #111827;
}

.modal p {
  color: var(--text-light);
  font-size: 14px;
  margin-bottom: 24px;
}

.modal button {
  background-color: var(--text-color);
}

.modal button:hover {
  background-color: #000;
}

</style>
</head>

<body>

<div class="container">
  <h1>お問い合わせ</h1>
  <p class="lead">
    ご質問・ご要望がございましたら、<br>下記フォームよりお気軽にご連絡ください。
  </p>

  <form id="contactForm">
    <div class="form-group">
      <label for="name">お名前<span class="required">必須</span></label>
      <input type="text" id="name" name="name" required placeholder="山田 太郎">
    </div>

    <div class="form-group">
      <label for="email">メールアドレス<span class="required">必須</span></label>
      <input type="email" id="email" name="email" required placeholder="example@email.com">
    </div>

    <div class="form-group">
      <label for="app">アプリ名<span class="required">必須</span></label>
      <select id="app" name="app" required>
        <option value="" disabled selected>お問い合わせのアプリを選択してください</option>
        <optgroup label="iOSアプリ">
          <option value="Toonify Studio">Toonify Studio</option>
          <option value="TuneDrop">TuneDrop</option>
          <option value="NonStop">NonStop</option>
          <option value="TrustGPS">TrustGPS</option>
          <option value="シンプル解凍">シンプル解凍</option>
          <option value="シンプルサブスク管理">シンプルサブスク管理</option>
          <option value="AppGuard">AppGuard</option>
          <option value="HOLD — PlunkTimer">HOLD — PlunkTimer</option>
          <option value="断酒クエスト">断酒クエスト</option>
          <option value="運動クエスト">運動クエスト</option>
          <option value="勉強クエスト">勉強クエスト</option>
          <option value="DevKeep">DevKeep</option>
          <option value="GEOAlame">GEOAlame</option>
          <option value="会議分給メーター">会議分給メーター</option>
          <option value="怒り箱 AngerBOX">怒り箱 AngerBOX</option>
          <option value="禁煙クエスト">禁煙クエスト</option>
          <option value="TuneDrop Focus — 集中タイマー">TuneDrop Focus — 集中タイマー</option>
          <option value="CodiceNatura ダ・ヴィンチノート">CodiceNatura ダ・ヴィンチノート</option>
          <option value="早起きクエスト">早起きクエスト</option>
          <option value="名言ガチャ">名言ガチャ</option>
          <option value="ネコベース">ネコベース</option>
          <option value="RemixMusic — DJミキサー">RemixMusic — DJミキサー</option>
          <option value="虚無ポスト VoidPost">虚無ポスト VoidPost</option>
          <option value="無断転載バリア">無断転載バリア</option>
          <option value="キャラ変翻訳機">キャラ変翻訳機</option>
        </optgroup>
        <optgroup label="WEBアプリ・ツール">
          <option value="OshiPay">OshiPay</option>
          <option value="Fit-Sign">Fit-Sign</option>
          <option value="これ俺の！(Itsme)">これ俺の！(Itsme)</option>
          <option value="LegacyMap">LegacyMap</option>
          <option value="VibeDiff">VibeDiff</option>
          <option value="VibeMap">VibeMap</option>
          <option value="AI字幕自動生成ツール">AI字幕自動生成ツール</option>
          <option value="ClearCut">ClearCut</option>
          <option value="画像・動画リサイズツール">画像・動画リサイズツール</option>
          <option value="Word自動ルビ振りツール">Word自動ルビ振りツール</option>
          <option value="青空文庫ルビ削除ツール">青空文庫ルビ削除ツール</option>
          <option value="CSV・Excel自動整形ツール">CSV・Excel自動整形ツール</option>
          <option value="StudyFocus">StudyFocus</option>
          <option value="KnowledgeMap">KnowledgeMap</option>
          <option value="TrashQuest">TrashQuest</option>
          <option value="RouteLog">RouteLog</option>
          <option value="Market Dashboard">Market Dashboard</option>
          <option value="WalkCraft">WalkCraft</option>
          <option value="ポワ・サバ">ポワ・サバ</option>
          <option value="Army・Rush">Army・Rush</option>
          <option value="Katana">Katana</option>
        </optgroup>
        <optgroup label="その他">
          <option value="その他">その他（下欄に入力）</option>
        </optgroup>
      </select>
      <input type="text" id="appOther" name="appOther" placeholder="アプリ名をご記入ください" style="display:none; margin-top:8px;">
    </div>

    <div class="form-group">
      <label for="subject">件名<span class="required">必須</span></label>
      <input type="text" id="subject" name="subject" required placeholder="お問い合わせの件">
    </div>

    <div class="form-group">
      <label for="message">お問い合わせ内容<span class="required">必須</span></label>
      <textarea id="message" name="message" required placeholder="詳細をご記入ください..."></textarea>
    </div>

    <button type="submit" id="submitButton">
      <span>送信する</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </form>

  <div class="note">
    ※ 内容を確認のうえ、順次ご返信いたします。
  </div>
</div>

<!-- Success Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h2>送信完了</h2>
    <p>お問い合わせありがとうございます。<br>内容を確認の上、担当者よりご連絡いたします。</p>
    <button onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
  const form = document.getElementById('contactForm');
  const submitButton = document.getElementById('submitButton');
  const spinner = document.getElementById('spinner');
  const buttonText = submitButton.querySelector('span');
  const modalOverlay = document.getElementById('modalOverlay');
  const appSelect = document.getElementById('app');
  const appOther = document.getElementById('appOther');

  // 「その他」選択時のみ自由入力欄を表示
  function syncAppOther() {
    const isOther = appSelect.value === 'その他';
    appOther.style.display = isOther ? 'block' : 'none';
    appOther.required = isOther;
    if (!isOther) appOther.value = '';
  }
  appSelect.addEventListener('change', syncAppOther);

  // GAS Web App URL
  const scriptURL = 'https://script.google.com/macros/s/AKfycbz3FX15E-_y0KFkl38dD2hezWGyImOfr9HN9SN2kqBMyDonabRi_cmIIAlKnBXjEw9T/exec';

  form.addEventListener('submit',e => {
    e.preventDefault();
    
    // UI Loading State
    submitButton.disabled = true;
    buttonText.textContent = '送信中...';
    spinner.style.display = 'block';

    const formData = new FormData(form);

    // 「その他」の場合は入力されたアプリ名を app として送信
    if (appSelect.value === 'その他' && appOther.value.trim()) {
      formData.set('app', appOther.value.trim());
    }
    formData.delete('appOther');
    // GAS側が app 未対応でも件名から判別できるようにする
    formData.set('subject', '【' + formData.get('app') + '】' + formData.get('subject'));

    fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors'})
      .then(response => {
        // Since mode is no-cors, we can't check response.ok. 
        // We assume success if the fetch promise resolves.
        showModal();
        form.reset();
        syncAppOther();
      })
      .catch(error => {
        console.error('Error!', error.message);
        alert('送信に失敗しました。もう一度お試しください。');
      })
      .finally(() => {
        // Reset Button State
        submitButton.disabled = false;
        buttonText.textContent = '送信する';
        spinner.style.display = 'none';
      });
  });

  function showModal() {
    modalOverlay.classList.add('active');
  }

  function closeModal() {
    modalOverlay.classList.remove('active');
  }

  // URLパラメータからの自動入力
  document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('app')) {
      const appValue = urlParams.get('app');
      const matched = Array.from(appSelect.options).some(o => o.value === appValue);
      if (matched) {
        appSelect.value = appValue;
      } else {
        appSelect.value = 'その他';
        appOther.value = appValue;
      }
      syncAppOther();
    }
    if(urlParams.has('subject')) {
      document.getElementById('subject').value = urlParams.get('subject');
    }
    if(urlParams.has('message')) {
      document.getElementById('message').value = urlParams.get('message');
    }
  });
</script>

</body>
</html>
